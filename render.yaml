# Render Blueprint Specification for JANSAAHAY Platform
services:
  # 1. Spring Boot API Service
  - type: web
    name: jansaahay-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: jansaahay-mysql
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: jansaahay-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jansaahay-mysql
          property: password
      - key: JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend (Static Site)
  - type: web
    name: jansaahay-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jansaahay-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Managed MySQL Database
  - name: jansaahay-mysql
    databaseName: jansaahaydb
    plan: starter
