# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always

# Spring Application Name
spring.application.name=jansaahay-backend

# Database Configuration (MySQL production fallback to H2 in-memory)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:jansaahaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (available locally at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
# In production, pass JWT_SECRET via environment variable
jwt.secret=${JWT_SECRET:JansaahaySecure256BitSecretKeyForJwtAuthenticationTokens2026!}
jwt.access-token-expiration-ms=86400000
jwt.refresh-token-expiration-ms=604800000

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.jansaahay=INFO
logging.level.org.springframework.security=WARN
